<div class="page-header">

  <h1>Courses</h1>

  <a routerLink="/courses/new">
    + Create Course
  </a>

</div>

<div class="search-section">

  <label for="search">
    Search:
  </label>

  <input
    id="search"
    type="text"
    [(ngModel)]="searchTerm"
    placeholder="Search courses..."
  >

</div>

<table>

  <thead>

  <tr>
    <th>Code</th>
    <th>Name</th>
    <th>Credits</th>
    <th>Actions</th>
  </tr>

  </thead>

  <tbody>

    @for (
      course of filteredCourses;
      track course.id
      ) {

      <tr>

        <td>
          {{ course.code }}
        </td>

        <td>
          {{ course.name }}
        </td>

        <td>
          {{ course.credits }}
        </td>

        <td>

          <a
            [routerLink]="['/courses', course.id]"
          >
            View
          </a>

          <button
            type="button"
            disabled="disabled"
          >
            Delete
          </button>

        </td>

      </tr>

    } @empty {

      <tr>

        <td
          colspan="4"
        >
          No courses found!
        </td>

      </tr>
    }

  </tbody>
</table>
