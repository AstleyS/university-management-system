<div class="app-layout">

  <aside class="sidebar glass">

    <div class="logo">
      <span class="logo-mark">U</span>
      <div>
        <strong>UMS</strong>
        <span>University System</span>
      </div>
    </div>

    <nav class="navigation">

      <span class="nav-section">Overview</span>

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span>Dashboard</span>
      </a>

      <span class="nav-section">Academic</span>

      <a routerLink="/students" routerLinkActive="active">
        <span>Students</span>
      </a>

      <a routerLink="/professors" routerLinkActive="active">
        <span>Professors</span>
      </a>

      <a routerLink="/courses" routerLinkActive="active">
        <span>Courses</span>
      </a>

      <a routerLink="/enrollments" routerLinkActive="active">
        <span>Enrollments</span>
      </a>

      <span class="nav-section">University</span>

      <a routerLink="/departments" routerLinkActive="active">
        <span>Departments</span>
      </a>

      <a routerLink="/faculties" routerLinkActive="active">
        <span>Faculties</span>
      </a>

      <a routerLink="/semesters" routerLinkActive="active">
        <span>Semesters</span>
      </a>

    </nav>

    <div class="sidebar-bottom">

      <button type="button">
        Settings
      </button>

      <button
        type="button"
        (click)="logout()"
      >
        Logout
      </button>

    </div>

  </aside>

  <div class="main-area">

    <header class="topbar">

      <div>
        <span class="topbar-label">Administration</span>
        <h1>University Management System</h1>
      </div>

      <div class="user-menu">
        <div class="avatar">A</div>

        <div class="user-info">
          <strong>Admin</strong>
          <span>Administrator</span>
        </div>
      </div>

    </header>

    <main class="content">
      <router-outlet></router-outlet>
    </main>

  </div>

</div>
